    LociType: 4
  Guid: f4ed4721-58ed-4eb2-ab52-a5ffb3f72edc

- Text:
    Text: It should be said that the skip of a third cannot prevent a succession of either two fifths or two octaves. The intervening note on the upbeat is regarded as hardly existing, since owing to its short duration and the small distance between the tones it cannot compensate to such an extent that the ear will not notice the two succeeding fifths or octaves.
    # TODO continue text on 44
    Logic: For succeeding downbeats of direct perfect consonances, there must be a skip greater than a third.
