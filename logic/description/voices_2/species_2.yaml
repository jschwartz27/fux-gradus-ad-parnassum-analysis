- Text:
    Text: ...the second comes on the upbeat, and may be dissonant if it moves from the preceding note and to the following note stepwise. However, if it moves by a skip, it must be consonant. In this species a dissonance may not occur, except by diminution, i.e., by filling out the space between two notes that are a third distance from each other... it makes no difference whether the note which results from the diminution is consonant or dissonant; it is satisfactory if the space between the two notes, a third distance from each other, is filled out.
    Note: null
    MyNote: "In theory is actually RelationType: 1, but programmatically is 2."
  Pages:
    PageNumberFrom: 41
    PageNumberTo: null
  EntryType: 1
  Fux:
    RelationType: 2
    LociType: 0
  Guid: 52bd6a88-cd29-42cc-9512-49105f08683e

- Text:
    Text: ...except that in this species the next to the last measure should have a fifth, followed by a major sixth, if the cantus firmus--or chorale medlody--is in the lower voice. If the cantus firmus is in the upper voice, there should be a fifth followed by a minor third.
    Logic: "For penultimate to final: fifth to major sixth if cf is in the lower voice else fifth to minor third."
    Note: null
    MyNote: null
  Pages:
