- Text: Finally, it should be noticed that in the next to the last bar there must be a major sixth if the cantus firmus is in the lower part; and a minor third, if it is in the upper part.
  Note: null
  MyNote: TODO here stated implicitly that last note interval is ALWAYS unison/octave
  FootNote: Thus, the seventh degree has to be raised in the Dorian (D), Mixolydian (G), and Aeolian (A) modes.
  PageNumberFrom: 28
  PageNumberTo: null
  EntryType: 1

- Text: The repition of a tone--the only way of using oblique motion in the first species--may occur occassionally in the counterpoint; however, the same tone should not be repeated more than once.
  Note: null
  MyNote: Fux himself then violates this in Fig. 15
  FootNote: null
