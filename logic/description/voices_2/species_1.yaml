- Text: Since, in this example, the cantus firmus is in D as the beginning and conclusion show, and you started with G, you have obviously forced the beginning out of the mode. Because of this I have corrected the fifth to an octave, which establishes the mode as the cantus firmus.
  Logic: The first and last note of the counterpoint must be unison or fifth in the mode.
  Note: null
  MyNote: null
  FootNote: null
  PageNumberFrom: 31
  PageNumberTo: null
  EntryType: 0

- Text: This mi against fa you have written in the progression from the sixth to the seventh bar by a skip of an augmented fourth or tritone which is hard to sing and sounds bad, for which reasons it is forbidden in strict counterpoint.
  Logic: Intra-voice movement of a tritone is not allowed.
